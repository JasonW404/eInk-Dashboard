site_name: InkPi Documentation
site_description: Raspberry Pi ambient productivity terminal
site_url: ""

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - User Manual:
      - Overview: user-manual/index.md
      - Installation and Deployment: user-manual/deployment.md
  - Development Docs:
      - Overview: development/index.md
      - Architecture: development/architecture.md
      - Developer Guide: development/developer-guide.md
      - Services:
          - API: development/services/api.md
          - Display: development/services/display.md
          - Host Agent: development/services/host-agent.md
      - Redesign Handoff: development/update.md
      - UI Specification: development/update.ui.md
