name: CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: cd backend && uv sync --extra dev
      - uses: oven-sh/setup-bun@v2
      - name: Build Web
        run: cd frontend && bun install --frozen-lockfile && bun run build
      - name: Compile check
        run: cd backend && uv run python -m compileall -q src/inkpi tests
      - name: Unit tests
        run: cd backend && uv run pytest -q
      - name: Build package
        run: cd backend && uv build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: cd backend && uv sync --extra dev
      - name: Ruff check
        run: cd backend && uv run ruff check src/inkpi tests
      - name: Ruff format check
        run: cd backend && uv run ruff format --check src/inkpi tests

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: cd backend && uv sync --extra dev
      - uses: oven-sh/setup-bun@v2
      - run: cd frontend && bun install --frozen-lockfile && bun run build
      - run: cd backend && uv run playwright install --with-deps chromium
      - name: Smoke test
        run: bash scripts/smoke_test.sh
