name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
      - run: cd backend && uv sync --extra dev
      - run: cd frontend && bun install --frozen-lockfile && bun run build
      - run: cd backend && uv run python -m compileall -q src/inkpi tests
      - run: cd backend && uv run pytest -q
      - run: cd backend && uv run ruff check src/inkpi tests ../packaging
      - run: cd backend && uv run ruff format --check src/inkpi tests ../packaging
      - run: bash -n deploy/*.sh packaging/*.sh scripts/*.sh

  binaries:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate version
        id: version
        shell: bash
        run: |
          FILE_VERSION="$(cat VERSION)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "${FILE_VERSION}" != "${TAG_VERSION}" ]]; then
            echo "VERSION file (${FILE_VERSION}) does not match tag (${TAG_VERSION})" >&2
            exit 1
          fi
          echo "version=${FILE_VERSION}" >> "${GITHUB_OUTPUT}"

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2

      - name: Build standalone executables
        run: |
          cd backend
          uv sync --extra dev --extra rpi
          cd ..
          bash packaging/build_binaries.sh

      - name: Build Web assets
        run: cd frontend && bun install --frozen-lockfile && bun run build

      - name: Assemble role bundles
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="${{ matrix.arch }}"

          CLOUD="inkpi-cloud-${VERSION}-linux-${ARCH}"
          mkdir -p "${CLOUD}/env" "${CLOUD}/systemd"
          cp -a build/standalone/inkpi-cloud "${CLOUD}/"
          cp -a build/standalone/inkpi-host-agent "${CLOUD}/"
          cp -a frontend/dist "${CLOUD}/web"
          cp deploy/env/cloud.env.example "${CLOUD}/env/"
          cp deploy/systemd/inkpi-cloud.service "${CLOUD}/systemd/"
          cp deploy/systemd/inkpi-host-agent.service "${CLOUD}/systemd/"
          cp packaging/install_cloud_bundle.sh "${CLOUD}/install.sh"
          cp deploy/uninstall_cloud.sh "${CLOUD}/uninstall.sh"
          cp VERSION "${CLOUD}/"
          printf '%s\n' "${ARCH}" > "${CLOUD}/ARCH"
          chmod +x "${CLOUD}/install.sh" "${CLOUD}/uninstall.sh"
          tar czf "${CLOUD}.tar.gz" "${CLOUD}"

          DISPLAY="inkpi-display-${VERSION}-linux-${ARCH}"
          mkdir -p "${DISPLAY}/env" "${DISPLAY}/systemd"
          cp -a build/standalone/inkpi-display "${DISPLAY}/"
          cp deploy/env/pi-display.env.example "${DISPLAY}/env/"
          cp deploy/systemd/inkpi-display.service "${DISPLAY}/systemd/"
          cp packaging/install_display_bundle.sh "${DISPLAY}/install.sh"
          cp deploy/uninstall_pi.sh "${DISPLAY}/uninstall.sh"
          cp VERSION "${DISPLAY}/"
          printf '%s\n' "${ARCH}" > "${DISPLAY}/ARCH"
          chmod +x "${DISPLAY}/install.sh" "${DISPLAY}/uninstall.sh"
          tar czf "${DISPLAY}.tar.gz" "${DISPLAY}"

      - uses: actions/upload-artifact@v4
        with:
          name: inkpi-bundles-${{ matrix.arch }}
          path: inkpi-*-linux-${{ matrix.arch }}.tar.gz

  release:
    needs: binaries
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: inkpi-bundles-*
          merge-multiple: true
      - name: Create checksums
        run: sha256sum inkpi-*.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            inkpi-*.tar.gz
            SHA256SUMS
          generate_release_notes: true
          name: "InkPi ${{ github.ref_name }}"
